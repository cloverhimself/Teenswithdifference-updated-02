name: React migration build
on:
  push:
    branches:
      - feat/react-vite-typescript
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type check and build
        run: npm run build
      - name: Upload static site preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cgmk-react-dist
          path: react-app/dist
