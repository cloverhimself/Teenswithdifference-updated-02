<script src="js/cgmk-home.js?v=20261122-drawer-v2"></script><script>
(()=>{'use strict';
const settings={
gallery:{title:"Our Gallery.",sub:"Moments from our church family",description:"Explore photographs from our different fellowships. Select a category above to filter the collection.",filters:["All","Men","Women","Youth","Teenagers","Children"],empty:"No photos match your search."},
messages:{title:"Our Messages.",sub:"Sermons and teachings",description:"Browse sermons, Bible study recordings, prayer meetings and conference messages when they are uploaded.",filters:["All","Sunday sermons","Bible study","Prayer meetings","Conventions","Series"],empty:"No audio messages are published here yet."},
materials:{title:"Our Materials.",sub:"Study resources and publications",description:"Explore Sunday school manuals, convention e-books, study notes and other downloadable resources when they are available.",filters:["All","Sunday school","Convention e-books","Bible study","Guides","Other"],empty:"No study materials are published here yet."}
};
const buttons=[...document.querySelectorAll('[data-section]')],cards=[...document.querySelectorAll('.cgmk-library-card')],filters=document.querySelector('#mediaFilters'),search=document.querySelector('#mediaSearch'),grid=document.querySelector('#mediaGrid'),empty=document.querySelector('#mediaEmpty'),count=document.querySelector('#mediaCount');let section='gallery',tag='All';
function render(){
 const cfg=settings[section];document.querySelector('#mediaHeading').innerHTML=cfg.title.replace('Gallery.','<em>Gallery.</em>').replace('Messages.','<em>Messages.</em>').replace('Materials.','<em>Materials.</em>');
 document.querySelector('#mediaSubheading').textContent=cfg.sub;document.querySelector('#mediaDescription').textContent=cfg.description;
 filters.replaceChildren();cfg.filters.forEach(name=>{const b=document.createElement('button');b.type='button';b.className='cgmk-filter-chip'+(tag===name?' active':'');b.setAttribute('aria-pressed',String(tag===name));b.textContent=name;b.addEventListener('click',()=>{tag=name;render();});filters.append(b);});
 const q=search.value.trim().toLowerCase();let shown=0;for(const card of cards){const visible=section==='gallery'&&(tag==='All'||card.dataset.group===tag)&&(!q||(card.dataset.title+' '+card.dataset.group).toLowerCase().includes(q));card.hidden=!visible;if(visible)shown++;}
 grid.hidden=shown===0;empty.hidden=shown>0;count.textContent=section==='gallery'?shown+' '+(shown===1?'photo':'photos'):'0 items';
 document.querySelector('#mediaEmptyTitle').textContent=section==='gallery'?'No matching photos':'Coming soon';
 document.querySelector('#mediaEmptyDescription').textContent=q?'Try a different keyword or category.':cfg.empty;
 buttons.forEach(b=>{const chosen=b.dataset.section===section;b.classList.toggle('is-selected',chosen);b.setAttribute('aria-pressed',String(chosen));});
}
buttons.forEach(b=>b.addEventListener('click',()=>{section=b.dataset.section;tag='All';search.value='';render();}));search.addEventListener('input',render);
const lightbox=document.querySelector('#photoLightbox'),lightImage=lightbox.querySelector('img'),lightCaption=lightbox.querySelector('p');let lastFocused=null;
function close(){lightbox.hidden=true;document.body.classList.remove('cgmk-no-scroll');lightImage.removeAttribute('src');lastFocused?.focus();}
cards.forEach(card=>card.addEventListener('click',()=>{lastFocused=card;lightImage.src=card.dataset.image;lightImage.alt=card.dataset.title;lightCaption.textContent=card.dataset.title;lightbox.hidden=false;document.body.classList.add('cgmk-no-scroll');lightbox.querySelector('button').focus();}));
lightbox.querySelector('button').addEventListener('click',close);lightbox.addEventListener('click',e=>{if(e.target===lightbox)close();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lightbox.hidden)close();});render();
})();
</script></body></html>
